<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Data - Mis Reproducciones</title>

  <!-- Script oficial de Flourish para renderizar embeds -->
  <script src="https://public.flourish.studio/resources/embed.js"></script>
  
  <style>
    /* Estilos globales estilo Spotify Dark Theme */
    :root {
      --spotify-green: #1DB954;
      --spotify-black: #121212;
      --spotify-dark-gray: #181818;
      --spotify-light-gray: #282828;
      --spotify-text-white: #ffffff;
      --spotify-text-sub: #b3b3b3;
    }

    body {
      background-color: var(--spotify-black);
      color: var(--spotify-text-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Encabezado */
    header {
      width: 100%;
      max-width: 900px;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .spotify-logo {
      width: 40px;
      height: 40px;
      background-color: var(--spotify-green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
      font-size: 20px;
    }

    h1.main-title {
      font-size: 2rem;
      margin: 0;
      letter-spacing: -0.5px;
    }

    /* Tarjetas contenedoras para gráficos */
    .card {
      background-color: var(--spotify-dark-gray);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 25px;
      width: 100%;
      max-width: 900px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      transition: background-color 0.3s ease;
      box-sizing: border-box;
    }

    .card:hover {
      background-color: var(--spotify-light-gray);
    }

    .card-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--spotify-green);
      margin: 0;
    }

    .card-subtitle {
      font-size: 0.9rem;
      color: var(--spotify-text-sub);
    }

    /* Contenedor adaptativo de gráficos */
    .graphic-container {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
    }

    .graphic-container img,
    .graphic-container object {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- Encabezado Principal -->
  <header>
    <div class="spotify-logo">▶</div>
    <h1 class="main-title">Spotify Visual Data</h1>
  </header>

  <!-- ========================================================= -->
  <!-- GRÁFICO 1: Datawrapper - Mi librería de canciones         -->
  <!-- ========================================================= -->
  <section class="card">
    <div class="card-header">
      <h2 class="card-title">Mi librería de canciones</h2>
      <span class="card-subtitle">Análisis general de la biblioteca</span>
    </div>
    <div class="graphic-container">
      <div style="min-height:403px" id="datawrapper-vis-AUfL8">
        <script type="text/javascript" defer src="https://datawrapper.dwcdn.net/AUfL8/embed.js" charset="utf-8" data-target="#datawrapper-vis-AUfL8"></script>
        <noscript>
          <img src="https://datawrapper.dwcdn.net/AUfL8/full.png" alt="Ranking Top 10 artistas (Bar Chart)" />
        </noscript>
      </div>
    </div>
  </section>

  <!-- ========================================================= -->
  <!-- GRÁFICO 2: Flourish - Reproducciones Top 10 Artistas      -->
  <!-- ========================================================= -->
  <section class="card">
    <div class="card-header">
      <h2 class="card-title">Reproducciones en minutos TOP 10 Artistas Principales</h2>
      <span class="card-subtitle">Agosto 2025 - Agosto 2026</span>
    </div>
    <div class="graphic-container">
      <div class="flourish-embed flourish-chart" data-src="visualisation/30074719">
        <noscript>
          <img src="https://public.flourish.studio/visualisation/30074719/thumbnail" width="100%" alt="chart visualization" />
        </noscript>
      </div>
    </div>
  </section>

</body>
</html>
